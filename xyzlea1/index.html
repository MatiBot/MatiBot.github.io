    if (!tween && !capturing) { controls.target.set(...VIEWS.hero.tgt); camera.position.copy(viewPos(VIEWS.hero)); }

  let downAt = null;
  const hitsPresent = (e) => {

    ndc.set((e.clientX - rect.left) / rect.width * 2 - 1, -(e.clientY - rect.top) / rect.height * 2 + 1);
    picker.setFromCamera(ndc, camera);
    return picker.intersectObject(present, true).length > 0;
  };
  renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (stage !== 'closed' || !downAt) return;
    const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]); downAt = null;
    if (moved < 6 && hitsPresent(e)) openPresent();
  });
  renderer.domElement.addEventListener('pointermove', (e) => {
    if (stage !== 'closed' || e.buttons) return;
    renderer.domElement.style.cursor = hitsPresent(e) ? 'pointer' : '';
  });

  /* ---------- UI ---------- */
  for (const btn of document.querySelectorAll('[data-light]')) btn.addEventListener('click', () => applyLook(btn.dataset.light));
  for (const btn of document.querySelectorAll('[data-view]')) btn.addEventListener('click', () => goView(btn.dataset.view));
  const spin = $('spin');
  spin.setAttribute('aria-pressed', String(spinWanted));
  spin.addEventListener('click', () => { spinWanted = !spinWanted; controls.autoRotate = spinWanted; spin.setAttribute('aria-pressed', String(spinWanted)); });
  $('snap').addEventListener('click', () => {
    renderer.render(scene, camera);
    $('photoImg').src = renderer.domElement.toDataURL('image/png');
    $('photo').hidden = false; $('photoClose').focus();
  });
  const closePhoto = () => { $('photo').hidden = true; $('snap').focus(); };
  $('photoClose').addEventListener('click', closePhoto);
  $('photo').addEventListener('click', (e) => { if (e.target === $('photo')) closePhoto(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('photo').hidden) closePhoto(); });

  // Redraw the lettering once the web fonts arrive
  if (document.fonts && document.fonts.load) {
    Promise.race([
      Promise.all([
        document.fonts.load('700 138px Caveat'),
        document.fonts.load('800 150px "Shippori Mincho B1"', '抹茶'),
        document.fonts.load('700 26px "Zen Kaku Gothic New"'),
        document.fonts.load('80px "Pinyon Script"')
      ]),
      new Promise((r) => setTimeout(r, 4000))
    ]).then(() => { drawCard(cardTex); drawSticker(stickerTex); drawEnvBack(envBackTex, envBackGlow); drawEnvFront(envFrontTex, envFrontGlow); }).catch(() => {});
  }

  // Frame-by-frame orbit for exporting a looping clip
  window.matchaCapture = {
    start(w, h, look) {
      capturing = true; tween = null;
      if (stage !== 'open') finishOpen();
      if (look) applyLook(look);
      renderer.setPixelRatio(1); renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
      return 'ok';
    },
    frame(i, n, o) {
      o = Object.assign({ radius: 20, height: 5.2, tx: 0.6, ty: 2.8, tz: -0.4, start: 0.48, fov: 36 }, o || {});

    }
  };

  /* ---------- loop ---------- */
  const ease = (k) => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const tStart = performance.now();

  function frame(now) {

    const t = (now - tStart) / 1000, dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
    if (stage === 'closed' && !reduceMotion) wigglePresent(t);

      }
      if (s > 3.05 && !tween) finishOpen();
    }
    updateConfetti(now, dt);
    if (tween) {
      const k = Math.min(1, (now - tween.t0) / tween.dur), e = ease(k);
      camera.position.lerpVectors(tween.fromP, tween.toP, e); controls.target.lerpVectors(tween.fromT, tween.toT, e);
      if (k >= 1) tween = null;
    }
    controls.update();
    if (!reduceMotion) { U.uTime.value = t; U.uPhase.value = t * 0.9; animateBalloons(t * 0.5); }
    animateEnvelope(reduceMotion ? 0 : t * 0.35, dt, false);
    sky.position.copy(camera.position);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
