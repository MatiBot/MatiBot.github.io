<!-- Contact Section -->
<section id="{{ page.title }}" class="container content-section text-center">
    <div class="row">
        <div class="col-lg-8 col-lg-offset-2">

          {{ page.content | markdownify }}

          {% if page.booking-url %}
            <div class="book-intro">
              <a class="book-intro-btn" href="{{ page.booking-url }}" target="_blank" rel="noopener">
                <i class="fa fa-calendar fa-fw" aria-hidden="true"></i> Book an intro
              </a>
              <p class="book-intro-note">30 minutes on Google Meet — pick any slot that works for you.</p>
            </div>
          {% endif %}

          {% if page.email %}
            <p><a href="mailto:{{ page.email }}">{{ page.email }}</a></p>
          {% endif %}

          {% include social-buttons.html %}

        </div>
    </div>
</section>
